#:tombi schema.strict = false

[project]
name = "datacook-app"
version = "2.12.0"
description = "Qt desktop tool for pandas data analysis that records every transformation as replayable Python code"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@gmail.com" },
]
maintainers = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@gmail.com" },
]
keywords = [
  "data analysis",
  "data science",
  "dataframe",
  "gui",
  "pandas",
  "qt",
  "statistics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "PySide6",
  "cutepandas>=0.6.2",
  "epregistry>=2.0.5",
  "numpy",
  "pandas",
  "platformdirs",
  "prettyqt>=1.63.1",
  "psutil>=7.2.2",
  "pyarrow>=26.0.1",
  "pydantic",
]

[project.urls]
"Code coverage" = "https://app.codecov.io/gh/phil65/datacook"
Documentation = "https://phil65.github.io/datacook/"
Issues = "https://github.com/phil65/datacook/issues"
Source = "https://github.com/phil65/datacook"

[project.gui-scripts]
datacook = "datacook.app:main"

[project.entry-points."datacook.ops"]
read_csv = "datacook.engine.ops.sources:ReadCsv"
read_parquet = "datacook.engine.ops.sources:ReadParquet"
read_feather = "datacook.engine.ops.sources:ReadFeather"
read_json = "datacook.engine.ops.sources:ReadJson"
read_excel = "datacook.engine.ops.sources:ReadExcel"
read_clipboard = "datacook.engine.ops.sources:ReadClipboard"
read_sqlite = "datacook.engine.ops.sources:ReadSqlite"
inline_data = "datacook.engine.ops.sources:InlineData"
select_columns = "datacook.engine.ops.columns:SelectColumns"
drop_columns = "datacook.engine.ops.columns:DropColumns"
rename_columns = "datacook.engine.ops.columns:RenameColumns"
astype = "datacook.engine.ops.columns:ChangeDtypes"
move_columns = "datacook.engine.ops.columns:MoveColumns"
sort_columns = "datacook.engine.ops.columns:SortColumns"
add_prefix = "datacook.engine.ops.columns:AddPrefix"
add_suffix = "datacook.engine.ops.columns:AddSuffix"
select_dtypes = "datacook.engine.ops.columns:SelectDtypes"
convert_dtypes = "datacook.engine.ops.columns:ConvertDtypes"
downcast = "datacook.engine.ops.columns:Downcast"
duplicate_columns = "datacook.engine.ops.columns:DuplicateColumns"
combine_columns = "datacook.engine.ops.columns:CombineColumns"
calculate_columns = "datacook.engine.ops.columns:CalculateColumns"
filter_rows = "datacook.engine.ops.rows:FilterRows"
sort_rows = "datacook.engine.ops.rows:SortRows"
head = "datacook.engine.ops.rows:Head"
sample = "datacook.engine.ops.rows:Sample"
drop_duplicates = "datacook.engine.ops.rows:DropDuplicates"
tail = "datacook.engine.ops.rows:Tail"
nlargest = "datacook.engine.ops.rows:NLargest"
nsmallest = "datacook.engine.ops.rows:NSmallest"
slice_rows = "datacook.engine.ops.rows:SliceRows"
filter_isin = "datacook.engine.ops.rows:FilterIsIn"
reset_index = "datacook.engine.ops.rows:ResetIndex"
fill_missing = "datacook.engine.ops.missing:FillMissing"
ffill = "datacook.engine.ops.missing:FillForward"
bfill = "datacook.engine.ops.missing:FillBackward"
drop_missing = "datacook.engine.ops.missing:DropMissing"
fill_statistic = "datacook.engine.ops.missing:FillWithStatistic"
interpolate = "datacook.engine.ops.missing:Interpolate"
drop_missing_columns = "datacook.engine.ops.missing:DropMissingColumns"
isna = "datacook.engine.ops.missing:IsMissing"
filter_missing = "datacook.engine.ops.missing:FilterMissing"
nan_to_missing = "datacook.engine.ops.missing:NanToMissing"
abs = "datacook.engine.ops.values:Abs"
clip = "datacook.engine.ops.values:Clip"
replace_values = "datacook.engine.ops.values:ReplaceValues"
cat_add_categories = "datacook.engine.ops.categorical:AddCategories"
cat_remove_categories = "datacook.engine.ops.categorical:RemoveCategories"
cat_rename_categories = "datacook.engine.ops.categorical:RenameCategories"
cat_reorder_categories = "datacook.engine.ops.categorical:ReorderCategories"
cat_set_categories = "datacook.engine.ops.categorical:SetCategories"
cat_as_ordered = "datacook.engine.ops.categorical:AsOrdered"
cat_as_unordered = "datacook.engine.ops.categorical:AsUnordered"
