site_name: ProcessAnalyzer
site_url: https://phil65.github.io/datacook/
site_author: Philipp Temminghoff
site_description: >-
  ProcessAnalyzer is a data analysis and manipulation tool
  ToDo
copyright: Copyright &copy; 2019 - 2020 Philipp Temminghoff

nav:
  - Home: index.md
  - Usage: usage_pandoc.md
  - Pages:
    # - Overview: pages/overview.md
    - Datasets: pages/datasets.md
    - Files: pages/files.md
    - Recipes: pages/recipes.md
    - Estimators: pages/estimators.md
    - Settings: pages/settings.md
    - Activity log: pages/log.md
  - CLI: cli.md
  - Plugins: plugins.md
  - Changelog: changelog.md
theme:
  features:
    # - tabs
    - instant
  name: material
  custom_dir: theme_customizations/
  # Don't include MkDocs' JavaScript
  include_search_page: false
  search_index_only: true
  palette:

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search:
      lang:
        - en
        - de
  - offline
  # - minify:
  #     minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/squidfunk

# pages:
#   - Material: index.md
#   - Getting started: getting-started.md
#   - Extensions:
#     - Admonition: extensions/admonition.md
#     - CodeHilite: extensions/codehilite.md
#   - Compliance with GDPR: compliance.md
#   - Release notes: release-notes.md
#   - Contributing: contributing.md
#   - License: license.md
markdown_extensions:
    - smarty
    - markdown.extensions.codehilite:
        guess_lang: false
    - admonition
    - pymdownx.magiclink
    - pymdownx.smartsymbols
    # - pymdownx.superfences
    # - pymdownx.betterem
    # - markdown.extensions.footnotes
    # - markdown.extensions.attr_list
    # - markdown.extensions.def_list
    # - markdown.extensions.tables
    # - markdown.extensions.abbr
    # - markdown.extensions.md_in_html
use_directory_urls: false
