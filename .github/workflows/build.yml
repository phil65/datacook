name: Build

on: [push, pull_request]

env:
  FORCE_COLOR: 1
  RUFF_OUTPUT_FORMAT: github
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The newest entry is a CPython pre-release: test it early, but don't let it block the build.
    # When a new CPython ships: bump this version and the matrix range end (stable versions must pass).
    continue-on-error: ${{ matrix.python_version == '3.16' }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.14", "3.15", "3.16"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies (uv sync)
        run: uv sync --all-extras --no-group docs

      # ruff / ty come from the pinned `lint` group, same versions as pre-commit.
      - name: Check for code issues (ruff check)
        run: uv run --no-group docs ruff check .

      - name: Check code format (ruff format)
        run: uv run --no-group docs ruff format --check .

      - name: Static type checking (ty)
        run: uv run --no-group docs ty check

      - name: Run tests
        run: uv run --no-group docs pytest --cov-report=xml --cov=src/datacook/ --cov-report=term-missing

      - name: Upload test results to Codecov
        # The upload sometimes hangs; never let it fail or block the build.
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          verbose: true

  # Engine on free-threaded Python, GIL disabled (DATACOOK_PLAN.md §0). Qt has no cp314t
  # wheels yet, so only the Qt-free engine deps are installed and app tests are skipped
  # (tests/conftest.py). Allowed to fail until the stack is stable there.
  test-free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      PYTHON_GIL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.14t
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14t

      - name: Install the engine (without Qt)
        run: |
          uv venv --python 3.14t
          uv pip install --no-deps -e .
          uv pip install epregistry numpy pandas platformdirs pyarrow pydantic openpyxl pytest

      - name: Check that the GIL stays disabled
        run: .venv/bin/python -c "import sys, datacook.engine, pandas, pyarrow; assert not sys._is_gil_enabled(), 'GIL enabled'"

      - name: Run engine tests
        run: .venv/bin/python -m pytest -p no:cacheprovider tests

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, so the notes cover everything since the last tag

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python_version }}

      - name: Build package
        run: uv build

      - name: Generate release notes
        # From the Conventional Commits since the previous tag (cliff.toml)
        run: uvx git-cliff --latest --strip header --output release-notes.md

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Release package on GitHub
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release-notes.md
          artifacts: dist/*.whl,dist/*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
